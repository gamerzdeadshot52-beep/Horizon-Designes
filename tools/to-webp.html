<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image → WebP converter (dev tool)</title>
  <!-- Dev-only helper (excluded via robots.txt): converts screenshots to WebP
       entirely in the browser using canvas — no build tools required.
       Drag PNG/JPG files onto the page (or use the file picker), then download
       each result. Re-run after replacing any project screenshot. -->
  <style>
    body {
      background: #0A0A0C; color: #F1EDE5; margin: 0;
      font: 15px/1.6 Manrope, system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      padding: 48px 20px; gap: 20px;
    }
    h1 { font: 600 22px/1.2 "Space Grotesk", system-ui, sans-serif; margin: 0; }
    p { color: #85838A; margin: 0; max-width: 56ch; text-align: center; }
    #drop {
      border: 1px dashed rgba(241,237,229,0.3); border-radius: 10px;
      padding: 44px 56px; text-align: center; cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    #drop.hot { border-color: #C6A675; background: rgba(198,166,117,0.06); }
    #drop strong { color: #C6A675; }
    #list { list-style: none; padding: 0; margin: 0; width: min(680px, 100%); }
    #list li {
      display: flex; align-items: center; gap: 14px;
      border: 1px solid rgba(241,237,229,0.12); border-radius: 8px;
      padding: 12px 16px; margin-bottom: 10px;
    }
    #list img { width: 72px; height: 48px; object-fit: cover; border-radius: 4px; flex: none; }
    #list .meta { flex: 1; min-width: 0; }
    #list .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #list .size { color: #85838A; font-size: 13px; }
    #list a {
      color: #0A0A0C; background: #C6A675; text-decoration: none;
      font: 600 13px "Space Grotesk", system-ui, sans-serif;
      padding: 8px 14px; border-radius: 999px; flex: none;
    }
    #file { display: none; }
  </style>
</head>
<body>
  <h1>Image → WebP</h1>
  <p>Converts screenshots to WebP in the browser. Drop PNG or JPG files here —
     each result gets a download button. Nothing is uploaded.</p>

  <div id="drop" role="button" tabindex="0"
       aria-label="Choose image files to convert to WebP">
    <strong>Drop images</strong> or click to choose files
  </div>
  <input id="file" type="file" accept="image/png,image/jpeg" multiple>

  <ul id="list" aria-live="polite"></ul>

  <script>
    (function () {
      var drop = document.getElementById('drop');
      var input = document.getElementById('file');
      var list = document.getElementById('list');

      drop.addEventListener('click', function () { input.click(); });
      drop.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); }
      });
      input.addEventListener('change', function () { handle(input.files); });

      ['dragenter', 'dragover'].forEach(function (ev) {
        drop.addEventListener(ev, function (e) {
          e.preventDefault(); drop.classList.add('hot');
        });
      });
      ['dragleave', 'drop'].forEach(function (ev) {
        drop.addEventListener(ev, function (e) {
          e.preventDefault(); drop.classList.remove('hot');
        });
      });
      drop.addEventListener('drop', function (e) {
        handle(e.dataTransfer.files);
      });

      function handle(files) {
        Array.prototype.forEach.call(files, function (file) {
          if (!/^image\/(png|jpeg)$/.test(file.type)) return;
          var reader = new FileReader();
          reader.onload = function (e) {
            var img = new Image();
            img.onload = function () { convert(file, img); };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      function convert(file, img) {
        var c = document.createElement('canvas');
        c.width = img.naturalWidth;
        c.height = img.naturalHeight;
        c.getContext('2d').drawImage(img, 0, 0);
        var url = c.toDataURL('image/webp', 0.85);
        if (url.indexOf('data:image/webp') !== 0) {
          addRow(file.name, img, null, 'WebP encoding unsupported in this browser');
          return;
        }
        addRow(file.name, img, url, null);
      }

      function addRow(name, img, url, error) {
        var li = document.createElement('li');

        var thumb = document.createElement('img');
        thumb.src = url || '';
        thumb.alt = '';
        li.appendChild(thumb);

        var meta = document.createElement('span');
        meta.className = 'meta';
        var label = document.createElement('span');
        label.className = 'name';
        label.textContent = name.replace(/\.[^.]+$/, '') + '.webp';
        var size = document.createElement('span');
        size.className = 'size';
        size.textContent = error
          ? error
          : img.naturalWidth + '×' + img.naturalHeight +
            ' · ' + Math.round((url.length - url.indexOf(',') - 1) * 0.75 / 1024) + ' KB (approx)';
        meta.appendChild(label);
        meta.appendChild(size);
        li.appendChild(meta);

        if (url) {
          var a = document.createElement('a');
          a.href = url;
          a.download = name.replace(/\.[^.]+$/, '') + '.webp';
          a.textContent = 'Download';
          li.appendChild(a);
        }

        list.appendChild(li);
      }
    })();
  </script>
</body>
</html>
